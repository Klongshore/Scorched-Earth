<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scorched Earth</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="stage">
      <canvas id="field" width="640" height="480"></canvas>
      <div id="overlay"></div>
    </div>
    <button
      id="mute-button"
      type="button"
      tabindex="-1"
      aria-label="Mute sound"
      aria-pressed="false"
    >
      <span class="on">🔊</span><span class="off">🔇</span>
    </button>
    <div id="touch-controls" class="idle"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
